# Monorepo sem package.json na raiz -- o Nixpacks não detecta Node sozinho,
# então força a instalação explicitamente (senão a imagem sobe sem npm).
[phases.setup]
nixPkgs = ["nodejs_22"]

[phases.install]
cmds = ["cd api && npm ci", "cd app && npm ci"]

[phases.build]
cmds = ["cd api && npm run build", "cd app && npm run build"]
