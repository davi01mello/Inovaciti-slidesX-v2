# ============================================
# Configuração do CodeRabbit — CITi
# Rito obrigatório de revisão automática de PR
# ============================================

language: "pt-BR"

reviews:
  # "chill" = menos ruído | "assertive" = mais rigoroso (recomendado p/ rito obrigatório)
  profile: "assertive"

  # Faz o CodeRabbit formalmente solicitar mudanças (não só comentar),
  # essencial pra virar rito obrigatório antes da aprovação humana
  request_changes_workflow: true

  high_level_summary: true      # gera resumo/walkthrough do PR
  poem: false                    # desativa o "poema" decorativo padrão
  review_status: true
  collapse_walkthrough: false

  auto_review:
    enabled: true
    drafts: false                # não revisa PRs em modo draft

  # --- Instruções por caminho de arquivo ---
  # Aqui é onde você direciona o foco da revisão em linguagem natural
  path_instructions:

    # Regra geral, aplicada a todo PR
    - path: "**/*"
      instructions: >
        Priorize, nesta ordem: (1) vulnerabilidades de segurança e más práticas
        (injeção, segredos hardcoded, validação de input, autenticação/autorização),
        (2) qualidade e legibilidade (complexidade, duplicação, nomes ruins),
        (3) decisões de arquitetura (acoplamento excessivo, responsabilidade mal
        distribuída, violação de camadas). Para cada PR, sugira também um trecho
        de documentação (docstring ou seção de README) descrevendo o que foi
        implementado, caso o PR não tenha documentação.

    # Reforço extra em áreas sensíveis de segurança
    - path: "**/auth/**"
      instructions: >
        Seja extremamente rigoroso com segurança aqui: qualquer lógica de
        autenticação, sessão ou permissão deve ser sinalizada se não tiver
        tratamento de erro explícito ou validação de entrada.

    # Ajuste conforme a stack real do repositório
    - path: "**/*.py"
      instructions: "Siga PEP8. Sinalize funções sem type hints e sem docstring."

    - path: "**/*.ts,**/*.tsx"
      instructions: "Sinalize uso de 'any', props sem tipagem, e componentes React sem memoização quando aplicável."

  # --- Ferramentas de análise ativadas ---
  tools:
    ruff:
      enabled: true
    eslint:
      enabled: true
    semgrep:          # SAST — segurança
      enabled: true
    gitleaks:          # detecção de segredos/credenciais vazadas
      enabled: true
    markdownlint:
      enabled: false

chat:
  auto_reply: true